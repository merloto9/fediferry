name: Build

on:
  # Pull requests only: branch protection on main requires these checks, with
  # the branch up to date, so a run after the merge would test the same code
  # again. Releases run the unit tests themselves (release.yml).
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Every module by name: `testDebugUnitTest` alone only exists in :app,
      # so the shared and server tests never ran here.
      - name: Unit tests
        run: ./gradlew :shared:test :server:test :app:testDebugUnitTest

      - name: Lint
        run: ./gradlew lintDebug

      - name: Assemble debug
        run: ./gradlew assembleDebug

      # Unsigned, but minified as a release is: an R8 rule that breaks the
      # build shows up here instead of on release day.
      - name: Assemble release
        run: ./gradlew assembleRelease

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
            shared/build/reports/
            shared/build/test-results/
            server/build/reports/
            server/build/test-results/
          retention-days: 7

  # Room migrations, the project merge and share pairing need a real Android.
  device-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: device-reports
          path: app/build/reports/androidTests/
          retention-days: 7
