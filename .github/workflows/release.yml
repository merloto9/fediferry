name: Release

# Tag a commit to cut a release:
#
#     git tag v0.2.0 && git push origin v0.2.0
#
# The APK attached to the resulting GitHub release is what Obtainium installs
# and, on later tags, offers as an update.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the leading v (e.g. 0.2.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # `secrets` is not available in a step-level `if`, so presence is tested
      # through env instead.
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Derive version
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            NAME="${{ github.event.inputs.version }}"
          else
            NAME="${GITHUB_REF_NAME#v}"
          fi

          if ! [[ "$NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::Version '$NAME' is not major.minor.patch"
            exit 1
          fi

          # A monotonic integer Android can compare. Obtainium keys "is there an
          # update" off the version, so this has to increase with every release.
          IFS=. read -r MAJOR MINOR PATCH <<< "${NAME%%-*}"
          CODE=$(( 10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH ))

          echo "name=$NAME"  >> "$GITHUB_OUTPUT"
          echo "code=$CODE"  >> "$GITHUB_OUTPUT"
          echo "tag=v$NAME"  >> "$GITHUB_OUTPUT"
          echo "Releasing $NAME (versionCode $CODE)"

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      # A release is never signed with the public debug key alone: anyone could
      # sign an "update" with it. Without the release key there is no release.
      - name: Require the release key
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 is not set. See README, \"Release signing\"."
            exit 1
          fi

      # RELEASE_KEYSTORE, not RELEASE_KEYSTORE_PATH: Gradle builds the APK
      # unsigned, and sign-release.sh signs it with the key rotated from the
      # debug key, which Gradle cannot do.
      - name: Decode release keystore
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        run: |
          ./gradlew assembleRelease \
            -Pfediferry.versionName=${{ steps.version.outputs.name }} \
            -Pfediferry.versionCode=${{ steps.version.outputs.code }}

      - name: Sign the APK
        id: apk
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          DEST="neoferry-${{ steps.version.outputs.name }}.apk"
          scripts/sign-release.sh app/build/outputs/apk/release/app-release-unsigned.apk "$DEST" | tee signing.txt
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$DEST" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # The debug key's v2 signature keeps Android 8 updating; the v3 one with
      # the lineage is what makes Android 9+ move to the release key.
      - name: Verify the rotation
        run: |
          set -euo pipefail
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" signing.txt
          grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" signing.txt
          rm -f "$RELEASE_KEYSTORE"

      - name: Changelog
        id: changelog
        run: |
          set -euo pipefail
          PREV=$(git tag --list 'v*' --sort=-v:refname \
                 | grep -v "^${{ steps.version.outputs.tag }}$" | head -1 || true)

          # CHANGELOG.md is written for people; the commit list is the fallback
          # for a release that predates an entry.
          SECTION=$(awk -v v="${{ steps.version.outputs.name }}" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md 2>/dev/null | sed '/./,$!d')

          {
            if [ -n "$SECTION" ]; then
              echo "$SECTION"
            elif [ -n "$PREV" ]; then
              echo "## Changes since $PREV"
              echo
              git log --no-merges --pretty='- %s' "$PREV..HEAD"
            else
              echo "## First release"
            fi
            echo
            echo "## Install"
            echo
            echo 'Add this repository in [Obtainium](https://github.com/ImranR98/Obtainium):'
            echo
            echo '    https://github.com/${{ github.repository }}'
            echo
            echo "Obtainium picks up the \`.apk\` attached below and offers each"
            echo "later release as an in-place update."
            echo
            echo "SHA-256: \`${{ steps.apk.outputs.sha256 }}\`"
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      # Published with the GitHub CLI, which is preinstalled on the runner, rather
      # than a third-party action. softprox/action-gh-release@v2 began failing
      # with "Error creating asset temp dir" once GitHub started forcing Node 20
      # actions onto Node 24, and the release path is not a good place for a
      # dependency that breaks under someone else's runtime migration.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          TITLE: NeoFerry ${{ steps.version.outputs.name }}
          APK: ${{ steps.apk.outputs.path }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail

          # Idempotent, so re-running a failed publish finishes the job instead
          # of erroring on a release that already half-exists.
          if gh release view "$TAG" >/dev/null 2>&1; then
            # --draft=false matters: a publish that failed part way through
            # leaves the release as a draft, and a draft is invisible to
            # everyone but the repository owner. Uploading into it then looks
            # like success while nobody can actually download the build.
            echo "Release $TAG exists; updating and publishing it."
            gh release edit "$TAG" \
              --title "$TITLE" \
              --notes-file RELEASE_NOTES.md \
              --draft=false
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" \
              --title "$TITLE" \
              --notes-file RELEASE_NOTES.md \
              "$APK"
          fi

          # Set separately rather than through an array argument: expanding an
          # empty array under `set -u` is an error on bash before 4.4.
          case "$VERSION" in
            *-*) gh release edit "$TAG" --prerelease ;;
          esac

          # Fail loudly rather than reporting success on an empty release.
          PUBLISHED=$(gh release view "$TAG" --json isDraft,assets \
            --jq '"draft=\(.isDraft) assets=\(.assets | length)"')
          echo "$TAG -> $PUBLISHED"
          case "$PUBLISHED" in
            *draft=true*) echo "::error::$TAG is still a draft"; exit 1 ;;
            *assets=0*)   echo "::error::$TAG has no APK attached"; exit 1 ;;
          esac
