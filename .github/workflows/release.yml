name: Release

# Tag a commit to cut a release:
#
#     git tag v0.2.0 && git push origin v0.2.0
#
# The APK attached to the resulting GitHub release is what Obtainium installs
# and, on later tags, offers as an update.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the leading v (e.g. 0.2.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # `secrets` is not available in a step-level `if`, so presence is tested
      # through env instead.
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Derive version
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            NAME="${{ github.event.inputs.version }}"
          else
            NAME="${GITHUB_REF_NAME#v}"
          fi

          if ! [[ "$NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::Version '$NAME' is not major.minor.patch"
            exit 1
          fi

          # A monotonic integer Android can compare. Obtainium keys "is there an
          # update" off the version, so this has to increase with every release.
          IFS=. read -r MAJOR MINOR PATCH <<< "${NAME%%-*}"
          CODE=$(( 10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH ))

          echo "name=$NAME"  >> "$GITHUB_OUTPUT"
          echo "code=$CODE"  >> "$GITHUB_OUTPUT"
          echo "tag=v$NAME"  >> "$GITHUB_OUTPUT"
          echo "Releasing $NAME (versionCode $CODE)"

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      # Only takes effect once the RELEASE_KEYSTORE_BASE64 secret exists.
      # Without it the build falls back to the repo's pinned debug key, which is
      # stable across runs and therefore still updatable in place.
      - name: Decode release keystore
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > keystore/release.jks
          echo "RELEASE_KEYSTORE_PATH=keystore/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -Pfediferry.versionName=${{ steps.version.outputs.name }} \
            -Pfediferry.versionCode=${{ steps.version.outputs.code }}

      - name: Stage the APK
        id: apk
        run: |
          set -euo pipefail
          SRC=app/build/outputs/apk/release/app-release.apk
          DEST="fediferry-${{ steps.version.outputs.name }}.apk"
          cp "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$DEST" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Verify the signature is unchanged
        run: |
          set -euo pipefail
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --print-certs \
            "${{ steps.apk.outputs.path }}"
          echo
          echo "If this certificate differs from the previous release, Obtainium"
          echo "cannot install the update in place — users must uninstall first."

      - name: Changelog
        id: changelog
        run: |
          set -euo pipefail
          PREV=$(git tag --list 'v*' --sort=-v:refname \
                 | grep -v "^${{ steps.version.outputs.tag }}$" | head -1 || true)

          # CHANGELOG.md is written for people; the commit list is the fallback
          # for a release that predates an entry.
          SECTION=$(awk -v v="${{ steps.version.outputs.name }}" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md 2>/dev/null | sed '/./,$!d')

          {
            if [ -n "$SECTION" ]; then
              echo "$SECTION"
            elif [ -n "$PREV" ]; then
              echo "## Changes since $PREV"
              echo
              git log --no-merges --pretty='- %s' "$PREV..HEAD"
            else
              echo "## First release"
            fi
            echo
            echo "## Install"
            echo
            echo 'Add this repository in [Obtainium](https://github.com/ImranR98/Obtainium):'
            echo
            echo '    https://github.com/${{ github.repository }}'
            echo
            echo "Obtainium picks up the \`.apk\` attached below and offers each"
            echo "later release as an in-place update."
            echo
            echo "SHA-256: \`${{ steps.apk.outputs.sha256 }}\`"
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: FediFerry ${{ steps.version.outputs.name }}
          body_path: RELEASE_NOTES.md
          files: ${{ steps.apk.outputs.path }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.name, '-') }}
