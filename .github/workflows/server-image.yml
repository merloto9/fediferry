name: Server image

# Builds the server's Docker image, runs it (server/smoke-test.sh) and
# publishes it to the GitHub Container Registry as
# ghcr.io/<owner>/fediferry-server:
#
#   pull request    ->  tested and smoke-tested, not pushed
#   push to main    ->  :main and :sha-<short sha>   (what the test server runs)
#   tag v1.2.3      ->  :1.2.3, :1.2 and :latest     (same tags as the app releases)
#   tag v1.2.3-rc.1 ->  :1.2.3-rc.1 only
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
    # On main only a change to the server or what it is built from needs a
    # new image. (Tag pushes ignore path filters, so a release always builds.)
    paths-ignore:
      - 'app/**'
      - 'design/**'
      - '**.md'

concurrency:
  group: server-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/fediferry-server

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Server tests
        env:
          FEDIFERRY_SERVER_ONLY: '1'
        run: ./gradlew :server:test

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One platform, loaded into the runner's Docker, so the image is run
      # before anything is pushed. The multi-arch build below reuses its layers.
      - name: Build for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64
          load: true
          tags: fediferry-server:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Starts it, upgrades onto it from the last release's data, and checks
      # the API, the volume and a restart. See the script.
      - name: Smoke test
        run: server/smoke-test.sh fediferry-server:smoke ${{ env.IMAGE }}:latest

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # arm64 as well, for a Raspberry Pi at home. The Gradle stage runs on the
      # runner's own platform (see the Dockerfile), so QEMU only has to unpack
      # the JRE stage and the build stays fast.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
